# Render Blueprint — deploys the backend API via Docker.
# The Dockerfile installs Node 20, g++, gcc, JDK, and Python3
# so all four languages (Java, Python, C++, C) work for code execution.
#
# The frontend (client/) is NOT deployed here — deploy that to Netlify
# separately (see netlify.toml at the repo root and the README).
#
# MongoDB is NOT provisioned here either — Render doesn't offer a MongoDB
# add-on (only Postgres/Key Value). Use a free MongoDB Atlas cluster and
# paste its connection string in as MONGO_URI below when prompted.

services:
  - type: web
    name: dsa-game
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string when prompted
      - key: CLIENT_URL
        value: https://fundsa.netlify.app
