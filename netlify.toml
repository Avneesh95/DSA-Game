# Netlify config for the client/ (React + Vite) app.
# If your Netlify site's "Base directory" isn't set in the UI, this file
# tells Netlify everything it needs: where to build from, what to run,
# and what to publish.

[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# SPA fallback: client-side routes must resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prevent index.html from being cached so users always get the newest bundle
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Cache hashed assets in assets/ immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

